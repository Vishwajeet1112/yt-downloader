# YouTube JavaScript challenge solving
--js-runtimes node:/usr/local/bin/node,deno:/root/.deno/bin/deno
--remote-components ejs:github

# YouTube PO-token provider (bgutil script mode)
--extractor-args "youtubepot-bgutilscript:script_path=/opt/bgutil-ytdlp-pot-provider/server/build/generate_once.js"
--extractor-args "youtube:player-client=mweb"

# Network reliability
--force-ipv4
--retries 5
--fragment-retries 5
--socket-timeout 30
