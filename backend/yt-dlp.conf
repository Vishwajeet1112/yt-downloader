# YouTube JavaScript challenge solving
--js-runtimes node:/usr/local/bin/node,deno:/root/.deno/bin/deno
--remote-components ejs:github

# YouTube PO-token provider: local bgutil HTTP server
--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
--extractor-args "youtube:player-client=mweb"

# Network reliability
--force-ipv4
--retries 10
--fragment-retries 10
--socket-timeout 30
